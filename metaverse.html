<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>事实元宇宙 · 园博会邮票首日实寄事件 | STProof</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.9.0/dist/ethers.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #f5f7fb; color: #1a2a3a; line-height: 1.6; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .btn { display: inline-block; padding: 12px 28px; border-radius: 8px; font-weight: 600; transition: all 0.3s; cursor: pointer; border: none; background: #165DFF; color: white; }
        .btn:hover { transform: translateY(-2px); background: #0E42C1; }
        .header { background: #0b2b3b; color: white; padding: 20px 0; text-align: center; }
        .header h1 { font-size: 1.8rem; margin-bottom: 8px; }
        .back-link { display: inline-block; margin-top: 12px; color: #ccc; text-decoration: underline; }
        .card { background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.08); margin: 30px 0; }
        .card-header { background: linear-gradient(135deg, #0b2b3b 0%, #1a4a6e 100%); color: white; padding: 30px; text-align: center; }
        .card-body { padding: 30px; }
        .event-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; background: #f7f8fa; padding: 20px; border-radius: 12px; margin-bottom: 30px; }
        .summary-item { text-align: center; }
        .summary-item .label { font-size: 13px; color: #6c86a3; }
        .summary-item .value { font-weight: 700; font-size: 16px; }
        .map-container { height: 350px; border-radius: 12px; overflow: hidden; margin-bottom: 30px; }
        .evidence-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 15px; margin: 20px 0; }
        .evidence-item { text-align: center; cursor: pointer; }
        .evidence-item img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 10px; border: 1px solid #eef2f6; }
        .evidence-item .label { font-size: 12px; color: #6c86a3; margin-top: 6px; }
        .cid-list { background: #f7f8fa; padding: 20px; border-radius: 12px; margin: 20px 0; }
        .cid-row { display: flex; flex-wrap: wrap; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #e2e8f0; }
        .cid-name { font-weight: 600; width: 140px; }
        .cid-value { font-family: monospace; font-size: 12px; word-break: break-all; flex: 1; color: #165DFF; }
        .cite-status { margin-top: 12px; font-size: 14px; color: #00A870; text-align: center; }
        footer { text-align: center; padding: 30px; color: #6c86a3; font-size: 12px; border-top: 1px solid #e2e8f0; margin-top: 30px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; cursor: pointer; }
        .modal img { max-width: 90%; max-height: 90%; border-radius: 8px; }
        @media (max-width: 700px) { .map-container { height: 250px; } }
    </style>
</head>
<body>

<div class="header">
    <div class="container">
        <h1>🌐 事实元宇宙 · 园博会邮票首日实寄事件</h1>
        <p>第十五届中国国际园林博览会纪念邮票 · 首日实寄 NFT #001</p>
        <a href="/" class="back-link">← 返回首页</a>
    </div>
</div>

<div class="container">
    <div class="card">
        <div class="card-header">
            <h2>📮 第十五届中国国际园林博览会纪念邮票</h2>
            <p>深圳南油邮局 · 首日实寄事件</p>
            <div style="margin-top: 12px;">
                <span style="background:rgba(255,255,255,0.2); padding:4px 12px; border-radius:20px; font-size:12px;">📅 2026-04-15</span>
                <span style="background:rgba(255,255,255,0.2); padding:4px 12px; border-radius:20px; font-size:12px;">📍 深圳南油邮局</span>
                <span style="background:rgba(255,255,255,0.2); padding:4px 12px; border-radius:20px; font-size:12px;">✅ 完整证据链</span>
            </div>
        </div>
        <div class="card-body">
            <!-- 事件摘要 -->
            <div class="event-summary">
                <div class="summary-item"><div class="label">邮票主题</div><div class="value">第十五届中国国际园林博览会</div></div>
                <div class="summary-item"><div class="label">核心日期</div><div class="value">2026-04-15</div></div>
                <div class="summary-item"><div class="label">核心地点</div><div class="value">深圳南油邮局</div></div>
                <div class="summary-item"><div class="label">序列编号</div><div class="value">STP-20260415-001</div></div>
            </div>

            <!-- GPS 地图 -->
            <div class="map-container" id="eventMap"></div>

            <!-- 公开证据照片 -->
            <h4 style="margin: 20px 0 12px;"><i class="fas fa-images"></i> 现场影像记录</h4>
            <div class="evidence-grid" id="photoGrid"></div>

            <!-- CID 证据清单 -->
            <div class="cid-list">
                <h4 style="margin-bottom: 12px;"><i class="fas fa-link"></i> IPFS 证据锚定 (CID)</h4>
                <div id="cidList"></div>
            </div>

            <!-- 引用交互 -->
            <div style="text-align: center; padding-top: 20px; border-top: 1px solid #e2e8f0;">
                <button id="citeButton" class="btn">🔗 引用此事件 · 支持事实 (0.0001 ETH)</button>
                <div id="citeStatus" class="cite-status"></div>
                <p style="font-size:12px; color:#6c86a3; margin-top:12px;">引用税: 70% 归事件发起人 · 30% 支持协议金库</p>
            </div>
        </div>
    </div>
</div>

<footer>
    <p>STProof Protocol | 凡发生，皆可存；凡存证，皆可信</p>
</footer>

<div id="imageModal" class="modal" onclick="closeModal()">
    <img id="modalImage" src="" alt="放大图片">
</div>

<script>
    // 照片列表
    const photoAssets = [
        { name: "发行公告", url: "https://ipfs.io/ipfs/bafkreih33trksr6oc7ddcrx26iywfjpcipsafb2l76tplcd4x6f4543c2m" },
        { name: "到达邮局", url: "https://ipfs.io/ipfs/bafybeidy5gmci3sswltf63jrqr2lcsjhxpa7t4wly2mo6ainrtflsve6fi" },
        { name: "首日封正面", url: "https://ipfs.io/ipfs/bafybeiamzq2aq2uwneq4e5hlyzqu3qecviwcqoujbk7emeprprudlclc4ge" },
        { name: "挂号信编码", url: "https://ipfs.io/ipfs/bafybeib57xurh2qwuosf4bpq44vqv7mbb223356b3cq4wlunvoroytyvwe" },
        { name: "邮寄凭证", url: "https://ipfs.io/ipfs/bafybeiaf6szedvwqhss7sbqfw7rq6v4u37p5dxiu6aooaukzkuc4hkaf2y" },
        { name: "邮路信息", url: "https://ipfs.io/ipfs/bafybeibb2pu5c2wvmgga6zfg7amk6rheyw2ebzjgndwdgwztyfrx37go5i" }
    ];

    // CID 列表
    const cidItems = [
        { name: "GPS 轨迹", cid: "bafkreiaksqwedp2whp6me74swxbpxztah4tjidzpz7cesaeslcknm5drby" },
        { name: "发行公报", cid: "bafkreih33trksr6oc7ddcrx26iywfjpcipsafb2l76tplcd4x6f4543c2m" },
        { name: "央视新闻录屏", cid: "bafybeic23tn5f2nyuxodc5rf462sfstkrqqquwblqlpounkqyvkeb7bxya" },
        { name: "气象数据录屏", cid: "bafybeignwaucy3wxfrxcnyilq3ditq4q4hq6ptianh4ln2zjd5ltyjglee" }
    ];

    const CONTRACT_ADDRESS = "0x2934ca1D3F3b8EfCDAf4735bD36A36E8bfa3a6A4";
    const TOKEN_ID = 0;
    const abi = ["function cite(uint256 tokenId) external payable returns (uint256)"];

    const trackPoints = [[22.5175,113.9245],[22.5178,113.9248],[22.5182,113.9252],[22.5185,113.9256],[22.5183,113.9260],[22.5179,113.9263],[22.5174,113.9261]];

    // 渲染照片
    const photoGrid = document.getElementById('photoGrid');
    photoAssets.forEach(asset => {
        const div = document.createElement('div');
        div.className = 'evidence-item';
        const img = document.createElement('img');
        img.src = asset.url;
        img.alt = asset.name;
        img.loading = 'lazy';
        img.onclick = () => openModal(asset.url);
        div.appendChild(img);
        const label = document.createElement('div');
        label.className = 'label';
        label.textContent = asset.name;
        div.appendChild(label);
        photoGrid.appendChild(div);
    });

    // 渲染 CID
    const cidList = document.getElementById('cidList');
    cidItems.forEach(item => {
        const row = document.createElement('div');
        row.className = 'cid-row';
        row.innerHTML = `<div class="cid-name">${item.name}</div><div class="cid-value"><a href="https://ipfs.io/ipfs/${item.cid}" target="_blank">${item.cid}</a></div>`;
        cidList.appendChild(row);
    });

    // 地图
    const map = L.map('eventMap').setView([22.5175, 113.9250], 17);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a>' }).addTo(map);
    L.polyline(trackPoints, { color: '#e63946', weight: 4 }).addTo(map);
    map.fitBounds(L.polyline(trackPoints).getBounds());

    // 引用功能
    const citeBtn = document.getElementById('citeButton');
    const citeStatus = document.getElementById('citeStatus');
    citeBtn.addEventListener('click', async () => {
        if (!window.ethereum) { citeStatus.innerHTML = "❌ 请安装 MetaMask"; return; }
        citeBtn.disabled = true;
        citeBtn.textContent = "⏳ 等待确认...";
        citeStatus.innerHTML = "📡 正在连接钱包...";
        try {
            const provider = new ethers.BrowserProvider(window.ethereum);
            await provider.send("eth_requestAccounts", []);
            const signer = await provider.getSigner();
            const contract = new ethers.Contract(CONTRACT_ADDRESS, abi, signer);
            const fee = ethers.parseEther("0.0001");
            const tx = await contract.cite(TOKEN_ID, { value: fee });
            citeStatus.innerHTML = `🔄 交易已发送: ${tx.hash.slice(0,10)}...`;
            await tx.wait();
            citeStatus.innerHTML = `✅ 引用成功！<a href="https://sepolia.etherscan.io/tx/${tx.hash}" target="_blank">查看 ↗</a>`;
            citeBtn.textContent = "✓ 已引用";
        } catch (err) {
            citeStatus.innerHTML = `❌ 失败: ${err.message}`;
            citeBtn.disabled = false;
            citeBtn.textContent = "🔗 重试引用";
        }
    });

    function openModal(url) { document.getElementById('imageModal').style.display = 'flex'; document.getElementById('modalImage').src = url; }
    function closeModal() { document.getElementById('imageModal').style.display = 'none'; }
</script>
</body>
</html>
