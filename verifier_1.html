<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudPost 数字存证验证器（适配 batch_encrypt.py）</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, sans-serif; }
        body { max-width: 800px; margin: 40px auto; padding: 20px; background: #f9f9f9; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h1 { color: #2c3e50; margin-top: 0; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        input[type="file"] { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; }
        button { background: #27ae60; color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-size: 16px; }
        button:hover { background: #219653; }
        .result { margin-top: 20px; padding: 15px; border-radius: 6px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .debug { margin-top: 20px; padding: 15px; background: #fff3cd; border: 1px solid #ffeaa7; border-radius: 6px; font-family: monospace; white-space: pre-wrap; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 CloudPost 数字存证验证器</h1>
        本工具专为 <code>batch_encrypt.py</code> 生成的加密文件设计

        <div class="form-group">
            <label for="encFile">1. 上传加密的 JSON 文件 (.enc)</label>
            <input type="file" id="encFile" accept=".enc">
        </div>

        <div class="form-group">
            <label for="keyFile">2. 上传对应的密钥文件 (.key.txt)</label>
            <input type="file" id="keyFile" accept=".key.txt">
        </div>

        <div class="form-group">
            <label for="otsFile">3. 上传 OTS 时间戳文件（可选，用于验证时间）</label>
            <input type="file" id="otsFile" accept=".ots">
        </div>

        <button onclick="verify()">开始验证</button>

        <div id="result" class="result" style="display:none;"></div>
        <div id="debug" class="debug" style="display:none;"></div>
    </div>

    <script>
        async function verify() {
            const encFile = document.getElementById('encFile').files[0];
            const keyFile = document.getElementById('keyFile').files[0];
            const otsFile = document.getElementById('otsFile').files[0];
            const resultDiv = document.getElementById('result');
            const debugDiv = document.getElementById('debug');

            resultDiv.style.display = 'block';
            debugDiv.style.display = 'block';
            resultDiv.className = 'result';
            debugDiv.innerHTML = '';

            if (!encFile || !keyFile) {
                resultDiv.innerHTML = '❌ 请上传 .enc 和 .key.txt 文件';
                resultDiv.classList.add('error');
                return;
            }

            try {
                // 读取 .enc 文件
                const encBuffer = await readFileAsArrayBuffer(encFile);
                const encBytes = new Uint8Array(encBuffer);
                
                // 前 16 字节是 IV
                const iv = encBytes.slice(0, 16);
                const ciphertext = encBytes.slice(16);

                // 读取 .key.txt 文件
                const keyText = await readFileAsText(keyFile);
                const keyHex = keyText.trim();
                if (keyHex.length !== 64) {
                    throw new Error(`密钥长度错误，应为64字符（32字节），当前为${keyHex.length}字符`);
                }
                const key = CryptoJS.enc.Hex.parse(keyHex);

                // 解密
                const decrypted = CryptoJS.AES.decrypt(
                    { ciphertext: CryptoJS.lib.WordArray.create(ciphertext) },
                    key,
                    { iv: CryptoJS.lib.WordArray.create(iv), mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 }
                );

                const plaintext = decrypted.toString(CryptoJS.enc.Utf8);
                if (!plaintext) {
                    throw new Error('解密成功但内容为空，可能是密钥错误或文件损坏');
                }

                // 显示解密结果
                resultDiv.innerHTML = '✅ 解密成功！';
                resultDiv.classList.add('success');

                // 尝试解析 JSON
                try {
                    const json = JSON.parse(plaintext);
                    resultDiv.innerHTML += 'JSON 格式有效，内容如下：';
                    resultDiv.innerHTML += '<pre>' + JSON.stringify(json, null, 2) + '</pre>';
                } catch (e) {
                    resultDiv.innerHTML += '警告：解密成功，但内容不是有效的 JSON 格式';
                    resultDiv.innerHTML += '<pre>' + plaintext + '</pre>';
                }

                // 如果有 OTS 文件，验证时间戳
                if (otsFile) {
                    try {
                        const otsText = await readFileAsText(otsFile);
                        // 这里可以添加 OTS 验证逻辑（简化版）
                        resultDiv.innerHTML += '✅ 已上传 OTS 文件，时间戳验证需额外实现';
                    } catch (e) {
                        resultDiv.innerHTML += '⚠️ OTS 文件读取失败';
                    }
                }

            } catch (err) {
                resultDiv.innerHTML = '❌ 验证失败：' + err.message;
                resultDiv.classList.add('error');
                debugDiv.innerHTML = '错误详情：\n' + err.stack;
            }
        }

        function readFileAsArrayBuffer(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsArrayBuffer(file);
            });
        }

        function readFileAsText(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsText(file);
            });
        }
    </script>
</body>
</html>
