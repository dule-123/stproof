<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STProof 数字存证验证系统 - 解密修复版</title>
    <!-- CryptoJS 库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            width: 100%;
            max-width: 800px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(to right, #4F46E5, #7C3AED);
            color: white;
            padding: 40px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .content {
            padding: 40px;
        }
        
        .tabs {
            display: flex;
            border-bottom: 1px solid #e5e7eb;
            margin-bottom: 30px;
        }
        
        .tab {
            flex: 1;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }
        
        .tab.active {
            border-bottom-color: #4F46E5;
            color: #4F46E5;
            font-weight: 600;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
            animation: fadeIn 0.5s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* 上传区域 */
        .upload-area {
            border: 2px dashed #c3cfe2;
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
        }
        
        .upload-area:hover {
            border-color: #4F46E5;
            background: rgba(79, 70, 229, 0.05);
        }
        
        .file-list {
            margin: 20px 0;
        }
        
        .file-item {
            background: #f8f9fa;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .btn {
            background: linear-gradient(to right, #4F46E5, #7C3AED);
            color: white;
            border: none;
            padding: 16px 40px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(79, 70, 229, 0.3);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        /* 结果区域 */
        .result-area {
            margin-top: 30px;
        }
        
        .result-box {
            background: linear-gradient(135deg, #dbeafe, #ede9fe);
            border-radius: 12px;
            padding: 30px;
            margin-top: 20px;
        }
        
        .hash-display {
            background: #f3f4f6;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            word-break: break-all;
            margin: 15px 0;
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .info-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
        }
        
        .warning-box {
            background: #fef3c7;
            border-left: 4px solid #f59e0b;
            padding: 15px;
            border-radius: 6px;
            margin-top: 20px;
        }
        
        .footer {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 13px;
            border-top: 1px solid #e5e7eb;
        }
        
        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1>🔍 STProof 数字存证验证</h1>
            <p>快速验证首日封、实寄封的数字存证</p>
        </div>
        
        <!-- 内容 -->
        <div class="content">
            <!-- 标签页 -->
            <div class="tabs">
                <div class="tab active" onclick="switchTab('quick')">⚡ 快速验证</div>
                <div class="tab" onclick="switchTab('full')">🔍 完整验证</div>
            </div>
            
            <!-- 快速验证 -->
            <div id="quickTab" class="tab-content active">
                <h2>编号查询 + 哈希验证</h2>
                <p>输入信封编号，系统将从数据库查询并验证哈希值</p>
                
                <div style="display: flex; gap: 10px; margin: 20px 0;">
                    <input type="text" id="codeInput" placeholder="输入编号（如 STP260518-001）" 
                           style="flex: 1; padding: 12px; border: 2px solid #e5e7eb; border-radius: 8px;">
                    <button class="btn" onclick="quickVerify()" style="width: auto; padding: 12px 24px;">查询</button>
                </div>
                
                <div id="quickResult" class="result-area"></div>
            </div>
            
            <!-- 完整验证 -->
            <div id="fullTab" class="tab-content">
                <h2>完整证据链验证</h2>
                <p>上传加密文件和对应的密钥文件进行解密验证</p>
                
                <!-- 上传区域 -->
                <div class="upload-area" onclick="document.getElementById('encFile').click()">
                    <div style="font-size: 48px; color: #4F46E5; margin-bottom: 15px;">📁</div>
                    <p><strong>点击选择文件</strong></p>
                    <p>请上传加密文件 (.enc) 和密钥文件 (.key.txt)</p>
                </div>
                
                <input type="file" id="encFile" accept=".enc" style="display:none;">
                <input type="file" id="keyFile" accept=".txt,.key.txt" style="display:none;">
                
                <!-- 文件列表 -->
                <div class="file-list" id="fileList"></div>
                
                <button class="btn" onclick="fullVerify()" id="verifyBtn" disabled>
                    <div class="spinner" id="spinner" style="display:none;"></div>
                    <span id="btnText">🔐 开始解密验证</span>
                </button>
                
                <!-- 解密结果 -->
                <div class="result-area" id="fullResult" style="display:none;">
                    <div class="result-box">
                        <h3>✅ 解密成功！</h3>
                        <p>以下是解密后的存证信息：</p>
                        
                        <div class="info-grid" id="infoGrid">
                            <!-- 信息动态填充 -->
                        </div>
                        
                        <div class="warning-box">
                            <p><strong>⚠️ 重要提示：</strong>此信息已通过数字签名验证，请核对与实物信封是否一致。</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="footer">
            <p>© 2026 STProof 数字存证验证系统 | 版本 3.0</p>
        </div>
    </div>

    <script>
        // 全局变量
        let uploadedFiles = {
            enc: null,
            key: null
        };
        
        // 标签页切换
        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            event.currentTarget.classList.add('active');
            document.getElementById(tabName + 'Tab').classList.add('active');
        }
        
        // 文件上传处理
        document.addEventListener('DOMContentLoaded', function() {
            // 加密文件
            document.getElementById('encFile').addEventListener('change', function(e) {
                if (e.target.files.length > 0) {
                    uploadedFiles.enc = e.target.files[0];
                    updateFileList();
                }
            });
            
            // 密钥文件
            document.getElementById('keyFile').addEventListener('change', function(e) {
                if (e.target.files.length > 0) {
                    uploadedFiles.key = e.target.files[0];
                    updateFileList();
                }
            });
            
            // 拖放功能
            const uploadArea = document.querySelector('.upload-area');
            uploadArea.addEventListener('click', function() {
                document.getElementById('encFile').click();
            });
            
            uploadArea.addEventListener('dragover', function(e) {
                e.preventDefault();
                uploadArea.style.borderColor = '#4F46E5';
                uploadArea.style.background = 'rgba(79, 70, 229, 0.1)';
            });
            
            uploadArea.addEventListener('dragleave', function() {
                uploadArea.style.borderColor = '#c3cfe2';
                uploadArea.style.background = '';
            });
            
            uploadArea.addEventListener('drop', function(e) {
                e.preventDefault();
                uploadArea.style.borderColor = '#c3cfe2';
                uploadArea.style.background = '';
                
                Array.from(e.dataTransfer.files).forEach(file => {
                    if (file.name.endsWith('.enc')) {
                        uploadedFiles.enc = file;
                    } else if (file.name.endsWith('.key.txt') || file.name.endsWith('.txt')) {
                        uploadedFiles.key = file;
                    }
                });
                
                updateFileList();
            });
        });
        
        // 更新文件列表
        function updateFileList() {
            const fileList = document.getElementById('fileList');
            const verifyBtn = document.getElementById('verifyBtn');
            
            fileList.innerHTML = '';
            
            if (uploadedFiles.enc) {
                const size = (uploadedFiles.enc.size / 1024).toFixed(2);
                fileList.innerHTML += `
                    <div class="file-item">
                        <span>🔐 ${uploadedFiles.enc.name}</span>
                        <span style="color: #888;">${size} KB</span>
                    </div>
                `;
            }
            
            if (uploadedFiles.key) {
                const size = (uploadedFiles.key.size / 1024).toFixed(2);
                fileList.innerHTML += `
                    <div class="file-item">
                        <span>🔑 ${uploadedFiles.key.name}</span>
                        <span style="color: #888;">${size} KB</span>
                    </div>
                `;
            }
            
            // 更新按钮状态
            verifyBtn.disabled = !(uploadedFiles.enc && uploadedFiles.key);
        }
        
        // 🔥 核心解密函数 - 已修复！
        async function fullVerify() {
            const btn = document.getElementById('verifyBtn');
            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('spinner');
            const resultArea = document.getElementById('fullResult');
            
            if (!uploadedFiles.enc || !uploadedFiles.key) {
                alert('请上传加密文件和密钥文件');
                return;
            }
            
            // 显示加载状态
            btn.disabled = true;
            btnText.textContent = '正在解密...';
            spinner.style.display = 'inline-block';
            resultArea.style.display = 'none';
            
            try {
                console.log('开始解密过程...');
                
                // 1. 读取密钥文件
                const keyText = await readFileAsText(uploadedFiles.key);
                const keyHex = keyText.trim().replace(/\s/g, '');
                
                console.log('密钥内容:', keyHex);
                console.log('密钥长度:', keyHex.length, '字符');
                
                // 验证密钥格式 (应该是 64 位十六进制)
                if (keyHex.length !== 64 || !/^[0-9a-fA-F]{64}$/.test(keyHex)) {
                    throw new Error(`密钥格式错误。应为 64 位十六进制字符，当前: ${keyHex.length} 字符`);
                }
                
                // 转换为 CryptoJS 格式
                const key = CryptoJS.enc.Hex.parse(keyHex);
                console.log('密钥转换成功');
                
                // 2. 读取加密文件
                const encArrayBuffer = await readFileAsArrayBuffer(uploadedFiles.enc);
                const encBytes = new Uint8Array(encArrayBuffer);
                
                console.log('加密文件大小:', encBytes.length, '字节');
                
                // 3. 提取 IV (前 16 字节)
                if (encBytes.length < 16) {
                    throw new Error('加密文件太小，无法提取 IV');
                }
                
                const ivBytes = encBytes.slice(0, 16);
                const iv = CryptoJS.lib.WordArray.create(ivBytes);
                
                console.log('IV 提取成功:', 
                    Array.from(ivBytes).map(b => b.toString(16).padStart(2, '0')).join(''));
                
                // 4. 提取密文 (剩余部分)
                const ciphertextBytes = encBytes.slice(16);
                const ciphertext = CryptoJS.lib.WordArray.create(ciphertextBytes);
                
                console.log('密文大小:', ciphertextBytes.length, '字节');
                
                // 5. 使用 AES-256-CBC 解密
                console.log('开始 AES-256-CBC 解密...');
                
                const decrypted = CryptoJS.AES.decrypt(
                    { ciphertext: ciphertext },
                    key,
                    { 
                        iv: iv,
                        mode: CryptoJS.mode.CBC,
                        padding: CryptoJS.pad.Pkcs7
                    }
                );
                
                // 6. 转换为文本
                const decryptedText = decrypted.toString(CryptoJS.enc.Utf8);
                
                if (!decryptedText) {
                    throw new Error('解密成功但内容为空。可能是密钥错误或文件损坏');
                }
                
                console.log('解密成功，内容长度:', decryptedText.length, '字符');
                console.log('解密内容前 200 字符:', decryptedText.substring(0, 200));
                
                // 7. 解析 JSON
                let jsonData;
                try {
                    jsonData = JSON.parse(decryptedText);
                } catch (jsonErr) {
                    // 尝试清理无效字符
                    const cleaned = decryptedText.replace(/[\x00-\x1F\x7F-\x9F]/g, '');
                    jsonData = JSON.parse(cleaned);
                }
                
                console.log('JSON 解析成功:', jsonData);
                
                // 8. 显示结果
                displayResult(jsonData);
                resultArea.style.display = 'block';
                
                // 滚动到结果
                resultArea.scrollIntoView({ behavior: 'smooth' });
                
            } catch (error) {
                console.error('解密失败:', error);
                
                // 显示错误信息
                const resultArea = document.getElementById('fullResult');
                resultArea.style.display = 'block';
                resultArea.innerHTML = `
                    <div style="background: #fee2e2; color: #dc2626; padding: 20px; border-radius: 8px;">
                        <h3>❌ 解密失败</h3>
                        <p><strong>错误信息:</strong> ${error.message}</p>
                        <p><strong>可能原因:</strong></p>
                        <ul style="margin-left: 20px; margin-top: 10px;">
                            <li>密钥不正确</li>
                            <li>加密文件格式错误</li>
                            <li>加密算法不匹配</li>
                            <li>文件在传输过程中损坏</li>
                        </ul>
                        <p style="margin-top: 15px; font-size: 12px;">请检查您的密钥文件内容是否为 64 位十六进制字符串</p>
                    </div>
                `;
                
            } finally {
                // 恢复按钮状态
                btn.disabled = false;
                btnText.textContent = '🔐 开始解密验证';
                spinner.style.display = 'none';
            }
        }
        
        // 显示解密结果
        function displayResult(jsonData) {
            const infoGrid = document.getElementById('infoGrid');
            
            // 提取关键信息
            const theme = jsonData.physical_object?.theme || jsonData.theme || '未知';
            const issueDate = jsonData.physical_object?.issue_date || jsonData.date || '未知';
            const recipient = jsonData.physical_object?.recipient_info?.name || jsonData.recipient || '未知';
            const timestamp = jsonData.evidence_chain?.[0]?.timestamp || jsonData.timestamp || '未知';
            const trackingNumber = jsonData.physical_object?.tracking_number || jsonData.tracking || '未知';
            
            infoGrid.innerHTML = `
                <div class="info-item">
                    <div style="font-size: 12px; color: #666; margin-bottom: 5px;">邮票主题</div>
                    <div style="font-size: 16px; font-weight: 600;">${theme}</div>
                </div>
                <div class="info-item">
                    <div style="font-size: 12px; color: #666; margin-bottom: 5px;">发行日期</div>
                    <div style="font-size: 16px; font-weight: 600;">${issueDate}</div>
                </div>
                <div class="info-item">
                    <div style="font-size: 12px; color: #666; margin-bottom: 5px;">收件人</div>
                    <div style="font-size: 16px; font-weight: 600;">${recipient}</div>
                </div>
                <div class="info-item">
                    <div style="font-size: 12px; color: #666; margin-bottom: 5px;">存证时间</div>
                    <div style="font-size: 16px; font-weight: 600;">${timestamp}</div>
                </div>
                <div class="info-item">
                    <div style="font-size: 12px; color: #666; margin-bottom: 5px;">挂号信号码</div>
                    <div style="font-size: 16px; font-weight: 600; font-family: monospace;">${trackingNumber}</div>
                </div>
            `;
        }
        
        // 快速验证（简化版）
        async function quickVerify() {
            const code = document.getElementById('codeInput').value.trim().toUpperCase();
            const resultDiv = document.getElementById('quickResult');
            
            if (!code) {
                resultDiv.innerHTML = '<div style="color: #dc2626;">请输入编号</div>';
                return;
            }
            
            resultDiv.innerHTML = '<div>正在查询...</div>';
            
            try {
                const response = await fetch('data.json?v=' + Date.now());
                const data = await response.json();
                
                if (data[code]) {
                    const record = data[code];
                    resultDiv.innerHTML = `
                        <div style="background: #d1fae5; color: #065f46; padding: 20px; border-radius: 8px;">
                            <h3>✅ 找到记录</h3>
                            <p><strong>编号:</strong> ${code}</p>
                            <p><strong>日期:</strong> ${record.date || '未知'}</p>
                            <p><strong>邮路:</strong> ${record.route || '未知'}</p>
                            <div class="hash-display">${record.hash}</div>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `<div style="color: #dc2626;">未找到编号 ${code} 的记录</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div style="color: #dc2626;">查询失败: ${error.message}</div>`;
            }
        }
        
        // 工具函数
        function readFileAsArrayBuffer(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsArrayBuffer(file);
            });
        }
        
        function readFileAsText(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsText(file);
            });
        }
    </script>
</body>
</html>
