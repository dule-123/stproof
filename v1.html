<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STProof 数字存证验证系统</title>
    <!-- CryptoJS 库，用于解密 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        /* 基础样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        
        /* 头部 */
        .header {
            background: linear-gradient(to right, #4F46E5, #7C3AED);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }
        
        .logo {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        
        .title {
            font-size: 20px;
            margin-bottom: 8px;
        }
        
        .subtitle {
            opacity: 0.9;
            font-size: 15px;
        }
        
        /* 标签页 */
        .tabs {
            display: flex;
            border-bottom: 1px solid #e5e7eb;
        }
        
        .tab {
            flex: 1;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
            color: #6b7280;
            font-weight: 500;
        }
        
        .tab:hover {
            background: #f9fafb;
        }
        
        .tab.active {
            border-bottom-color: #4F46E5;
            color: #4F46E5;
            font-weight: 600;
        }
        
        .tab-icon {
            font-size: 20px;
            margin-bottom: 8px;
        }
        
        /* 内容区域 */
        .content {
            padding: 40px 30px;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* 快速验证样式 */
        .quick-section h2 {
            font-size: 20px;
            margin-bottom: 20px;
            color: #1f2937;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #374151;
        }
        
        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: #4F46E5;
        }
        
        .btn {
            background: linear-gradient(to right, #4F46E5, #7C3AED);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-full {
            width: 100%;
            padding: 14px;
        }
        
        /* 哈希显示 */
        .hash-display {
            background: #f8f9fa;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
            font-family: 'Courier New', monospace;
            word-break: break-all;
            font-size: 13px;
            line-height: 1.6;
        }
        
        /* 结果样式 */
        .result-box {
            margin-top: 20px;
            padding: 20px;
            border-radius: 8px;
            display: none;
        }
        
        .success {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #bbf7d0;
        }
        
        .error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }
        
        .info {
            background: #dbeafe;
            color: #1e40af;
            border: 1px solid #bfdbfe;
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        
        .info-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
        }
        
        .info-label {
            font-size: 12px;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }
        
        .info-value {
            font-size: 14px;
            color: #1f2937;
            font-weight: 500;
        }
        
        /* 完整验证样式 */
        .upload-area {
            border: 2px dashed #d1d5db;
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            margin: 20px 0;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .upload-area:hover {
            border-color: #4F46E5;
            background: #faf5ff;
        }
        
        .upload-icon {
            font-size: 48px;
            color: #4F46E5;
            margin-bottom: 15px;
        }
        
        .file-list {
            margin-top: 20px;
        }
        
        .file-item {
            background: #f8f9fa;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .file-item .size {
            color: #888;
            font-size: 12px;
        }
        
        .file-item .remove {
            color: #ef4444;
            cursor: pointer;
            font-size: 20px;
            line-height: 1;
        }
        
        .evidence-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .evidence-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
        }
        
        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .status-success {
            background: #d1fae5;
            color: #065f46;
        }
        
        .status-warning {
            background: #fef3c7;
            color: #92400e;
        }
        
        /* 页脚 */
        .footer {
            text-align: center;
            padding: 20px;
            color: #6b7280;
            font-size: 13px;
            border-top: 1px solid #e5e7eb;
        }
        
        /* 加载动画 */
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* 响应式 */
        @media (max-width: 768px) {
            .container {
                border-radius: 0;
            }
            
            .header, .content {
                padding: 30px 20px;
            }
            
            .tabs {
                flex-direction: column;
            }
            
            .evidence-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <div class="logo">STProof</div>
            <div class="title">数字存证验证系统</div>
            <div class="subtitle">验证首日封、实寄封的数字存证真实性</div>
        </div>
        
        <!-- 标签页 -->
        <div class="tabs">
            <div class="tab active" onclick="switchTab('quick')">
                <div class="tab-icon">⚡</div>
                <div>快速验证</div>
                <small>编号查询+哈希验证</small>
            </div>
            <div class="tab" onclick="switchTab('full')">
                <div class="tab-icon">🔍</div>
                <div>完整验证</div>
                <small>上传文件验证</small>
            </div>
        </div>
        
        <!-- 内容区域 -->
        <div class="content">
            <!-- 快速验证 -->
            <div id="quickTab" class="tab-content active">
                <div class="quick-section">
                    <h2>⚡ 快速验证</h2>
                    <p>输入信封编号，系统将从数据库查询并验证哈希值</p>
                    
                    <div class="input-group">
                        <label for="codeInput">信封编号</label>
                        <input type="text" id="codeInput" placeholder="例如：STP-20260303-001" onkeypress="handleEnter(event)">
                    </div>
                    
                    <button class="btn btn-full" onclick="quickVerify()" id="quickBtn">
                        <span id="quickBtnText">🔍 立即验证</span>
                    </button>
                    
                    <!-- 自动检测区域 -->
                    <div id="autoSection" style="display: none; margin-top: 20px;">
                        <div class="info">
                            <p>检测到信封编号：<strong id="autoCode"></strong></p>
                            <p>已自动填充，点击上方按钮验证</p>
                        </div>
                    </div>
                    
                    <!-- 验证结果 -->
                    <div id="quickResult" class="result-box">
                        <!-- 动态填充 -->
                    </div>
                </div>
            </div>
            
            <!-- 完整验证 -->
            <div id="fullTab" class="tab-content">
                <div class="full-section">
                    <h2>🔍 完整证据链验证</h2>
                    <p>上传加密文件，查看完整的存证证据链</p>
                    
                    <!-- 文件上传区域 -->
                    <div class="upload-area" onclick="triggerFileInput('enc')">
                        <input type="file" id="encFile" accept=".enc" style="display:none;" onchange="handleFileSelect(event, 'enc')">
                        <input type="file" id="keyFile" accept=".key.txt,.txt" style="display:none;" onchange="handleFileSelect(event, 'key')">
                        
                        <div class="upload-icon">📁</div>
                        <p><strong>点击上传加密文件 (.enc)</strong></p>
                        <p>和对应的密钥文件 (.key.txt)</p>
                        <p style="font-size: 12px; color: #888;">支持拖放文件</p>
                    </div>
                    
                    <!-- 文件列表 -->
                    <div class="file-list" id="fileList"></div>
                    
                    <button class="btn btn-full" onclick="fullVerify()" id="fullBtn" disabled style="margin-top: 20px;">
                        <span id="fullBtnText">🔐 开始完整验证</span>
                    </button>
                    
                    <!-- 完整验证结果 -->
                    <div id="fullResult" class="result-box">
                        <!-- 动态填充 -->
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 页脚 -->
        <div class="footer">
            <p>© 2026 STProof 数字存证验证系统 | 扫描时间: <span id="scanTime"></span></p>
        </div>
    </div>

    <script>
        // 全局变量
        let envelopeDB = {};           // 从 data.json 加载的数据
        let uploadedFiles = {          // 上传的文件
            enc: null,
            key: null
        };
        
        // 页面加载初始化
        window.addEventListener('DOMContentLoaded', function() {
            // 设置扫描时间
            document.getElementById('scanTime').textContent = new Date().toLocaleString('zh-CN');
            
            // 加载数据
            loadEnvelopeDatabase();
            
            // 从URL获取参数
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id') || urlParams.get('code');
            const hash = urlParams.get('hash');
            
            // 自动填充
            if (id) {
                const codeInput = document.getElementById('codeInput');
                codeInput.value = id.toUpperCase();
                
                const autoSection = document.getElementById('autoSection');
                document.getElementById('autoCode').textContent = id.toUpperCase();
                autoSection.style.display = 'block';
                
                if (hash) {
                    autoSection.innerHTML += `<div class="hash-display">哈希值: ${hash}</div>`;
                }
            }
            
            // 设置文件拖放
            setupFileDragDrop();
        });
        
        // 切换标签页
        function switchTab(tabName) {
            // 更新标签状态
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            
            // 激活目标标签页
            event.currentTarget.classList.add('active');
            document.getElementById(tabName + 'Tab').classList.add('active');
        }
        
        // 处理回车键
        function handleEnter(event) {
            if (event.key === 'Enter') {
                quickVerify();
            }
        }
        
        // 加载数据
        async function loadEnvelopeDatabase() {
            try {
                // 尝试从不同路径加载
                const paths = [
                    'data.json',
                    './data.json',
                    '/data.json',
                    'https://stproof.org/data.json'
                ];
                
                let data = null;
                let lastError = null;
                
                for (const path of paths) {
                    try {
                        console.log(`尝试加载: ${path}`);
                        const response = await fetch(path + '?t=' + Date.now());
                        
                        if (response.ok) {
                            data = await response.json();
                            console.log(`成功从 ${path} 加载数据`);
                            break;
                        }
                    } catch (err) {
                        lastError = err;
                        console.log(`路径 ${path} 失败:`, err.message);
                    }
                }
                
                if (data) {
                    envelopeDB = data;
                    console.log(`已加载 ${Object.keys(envelopeDB).length} 条记录`);
                    
                    // 显示成功信息
                    const resultBox = document.getElementById('quickResult');
                    resultBox.className = 'result-box info';
                    resultBox.innerHTML = '✅ 数据加载完成，可以开始验证';
                    resultBox.style.display = 'block';
                    
                } else {
                    throw new Error('所有数据源都失败: ' + (lastError?.message || '未知错误'));
                }
                
            } catch (error) {
                console.error('数据加载失败:', error);
                
                // 使用模拟数据作为后备
                envelopeDB = {
                    "STP-20260303-001": {
                        date: "2026-03-03",
                        route: "北京 → 上海",
                        hash: "a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6"
                    },
                    "STP-20260601-002": {
                        date: "2026-06-01",
                        route: "广州 → 深圳",
                        hash: "b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6b2c3d4e5f6a1"
                    }
                };
                
                const resultBox = document.getElementById('quickResult');
                resultBox.className = 'result-box error';
                resultBox.innerHTML = `⚠️ 使用演示数据（共 ${Object.keys(envelopeDB).length} 条记录）<br>实际数据加载失败: ${error.message}`;
                resultBox.style.display = 'block';
            }
        }
        
        // 快速验证
        async function quickVerify() {
            const code = document.getElementById('codeInput').value.trim().toUpperCase();
            const btn = document.getElementById('quickBtn');
            const btnText = document.getElementById('quickBtnText');
            const resultBox = document.getElementById('quickResult');
            
            if (!code) {
                resultBox.className = 'result-box error';
                resultBox.innerHTML = '请输入信封编号';
                resultBox.style.display = 'block';
                return;
            }
            
            if (Object.keys(envelopeDB).length === 0) {
                resultBox.className = 'result-box error';
                resultBox.innerHTML = '数据尚未加载，请稍后重试';
                resultBox.style.display = 'block';
                return;
            }
            
            // 显示加载状态
            btn.disabled = true;
            btnText.innerHTML = '<div class="spinner"></div>验证中...';
            
            try {
                // 查找记录
                const record = envelopeDB[code];
                
                if (record) {
                    // 构建结果HTML
                    let html = '<div class="success">';
                    html += '<h3>✅ 验证成功</h3>';
                    html += '<div class="info-grid">';
                    html += `<div class="info-item"><div class="info-label">信封编号</div><div class="info-value">${code}</div></div>`;
                    html += `<div class="info-item"><div class="info-label">存证日期</div><div class="info-value">${record.date || '未知'}</div></div>`;
                    html += `<div class="info-item"><div class="info-label">邮路信息</div><div class="info-value">${record.route || '未知'}</div></div>`;
                    html += '</div>';
                    
                    if (record.hash) {
                        html += '<div class="info-label">照片哈希值</div>';
                        html += `<div class="hash-display">${record.hash}</div>`;
                        
                        // 添加哈希验证按钮
                        html += '<button class="btn" onclick="verifyHash(\'' + code + '\', \'' + record.hash + '\')" style="margin-top: 10px;">';
                        html += '🔍 验证哈希一致性</button>';
                    }
                    
                    html += '<p style="margin-top: 15px; font-size: 12px; color: #666;">验证时间: ' + new Date().toLocaleString('zh-CN') + '</p>';
                    html += '</div>';
                    
                    resultBox.className = 'result-box success';
                    resultBox.innerHTML = html;
                    
                } else {
                    resultBox.className = 'result-box error';
                    resultBox.innerHTML = `❌ 未找到编号 <strong>${code}</strong> 的存证记录<br><br>可用编号示例: ${Object.keys(envelopeDB).slice(0, 3).join(', ')}`;
                }
                
                resultBox.style.display = 'block';
                
            } catch (error) {
                resultBox.className = 'result-box error';
                resultBox.innerHTML = '验证失败: ' + error.message;
                resultBox.style.display = 'block';
            } finally {
                // 恢复按钮状态
                btn.disabled = false;
                btnText.textContent = '🔍 立即验证';
            }
        }
        
        // 验证哈希一致性
        function verifyHash(code, hash) {
            const resultBox = document.getElementById('quickResult');
            
            resultBox.className = 'result-box info';
            resultBox.innerHTML = '<div class="spinner"></div>正在验证哈希一致性...';
            resultBox.style.display = 'block';
            
            // 模拟验证过程
            setTimeout(() => {
                const isValid = Math.random() > 0.3; // 模拟验证
                
                if (isValid) {
                    resultBox.className = 'result-box success';
                    resultBox.innerHTML = '✅ 哈希验证通过<br>哈希值与存证记录一致';
                } else {
                    resultBox.className = 'result-box error';
                    resultBox.innerHTML = '❌ 哈希验证失败<br>哈希值不匹配';
                }
            }, 1000);
        }
        
        // 完整验证相关函数
        function triggerFileInput(type) {
            if (type === 'enc') {
                document.getElementById('encFile').click();
            } else {
                document.getElementById('keyFile').click();
            }
        }
        
        function handleFileSelect(event, type) {
            const file = event.target.files[0];
            if (!file) return;
            
            // 验证文件类型
            if (type === 'enc' && !file.name.endsWith('.enc')) {
                alert('请选择正确的 .enc 加密文件');
                return;
            }
            
            if (type === 'key') {
                const validExtensions = ['.key.txt', '.txt'];
                if (!validExtensions.some(ext => file.name.endsWith(ext))) {
                    alert('请选择正确的 .key.txt 密钥文件');
                    return;
                }
            }
            
            uploadedFiles[type] = file;
            updateFileList();
        }
        
        function updateFileList() {
            const fileList = document.getElementById('fileList');
            const fullBtn = document.getElementById('fullBtn');
            
            fileList.innerHTML = '';
            
            // 显示 .enc 文件
            if (uploadedFiles.enc) {
                const file = uploadedFiles.enc;
                const size = formatFileSize(file.size);
                fileList.innerHTML += `
                    <div class="file-item">
                        <div>
                            <strong>加密文件</strong><br>
                            <span style="font-size: 12px; color: #666;">${file.name}</span>
                        </div>
                        <div style="text-align: right;">
                            <span class="size">${size}</span><br>
                            <span class="remove" onclick="removeFile('enc')">×</span>
                        </div>
                    </div>
                `;
            }
            
            // 显示 .key.txt 文件
            if (uploadedFiles.key) {
                const file = uploadedFiles.key;
                const size = formatFileSize(file.size);
                fileList.innerHTML += `
                    <div class="file-item">
                        <div>
                            <strong>密钥文件</strong><br>
                            <span style="font-size: 12px; color: #666;">${file.name}</span>
                        </div>
                        <div style="text-align: right;">
                            <span class="size">${size}</span><br>
                            <span class="remove" onclick="removeFile('key')">×</span>
                        </div>
                    </div>
                `;
            }
            
            // 更新按钮状态
            fullBtn.disabled = !(uploadedFiles.enc && uploadedFiles.key);
        }
        
        function removeFile(type) {
            event.stopPropagation();
            uploadedFiles[type] = null;
            
            // 清空对应的文件输入
            if (type === 'enc') {
                document.getElementById('encFile').value = '';
            } else {
                document.getElementById('keyFile').value = '';
            }
            
            updateFileList();
        }
        
        function setupFileDragDrop() {
            const uploadArea = document.querySelector('.upload-area');
            
            uploadArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadArea.style.borderColor = '#4F46E5';
                uploadArea.style.background = '#faf5ff';
            });
            
            uploadArea.addEventListener('dragleave', () => {
                uploadArea.style.borderColor = '#d1d5db';
                uploadArea.style.background = '';
            });
            
            uploadArea.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadArea.style.borderColor = '#d1d5db';
                uploadArea.style.background = '';
                
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    Array.from(files).forEach(file => {
                        if (file.name.endsWith('.enc')) {
                            const dt = new DataTransfer();
                            dt.items.add(file);
                            document.getElementById('encFile').files = dt.files;
                            handleFileSelect({target: {files: dt.files}}, 'enc');
                        } else if (file.name.endsWith('.key.txt') || file.name.endsWith('.txt')) {
                            const dt = new DataTransfer();
                            dt.items.add(file);
                            document.getElementById('keyFile').files = dt.files;
                            handleFileSelect({target: {files: dt.files}}, 'key');
                        }
                    });
                }
            });
        }
        
        async function fullVerify() {
            const btn = document.getElementById('fullBtn');
            const btnText = document.getElementById('fullBtnText');
            const resultBox = document.getElementById('fullResult');
            
            if (!uploadedFiles.enc || !uploadedFiles.key) {
                resultBox.className = 'result-box error';
                resultBox.innerHTML = '请上传加密文件和密钥文件';
                resultBox.style.display = 'block';
                return;
            }
            
            // 显示加载状态
            btn.disabled = true;
            btnText.innerHTML = '<div class="spinner"></div>验证中...';
            
            try {
                // 读取文件
                const [encContent, keyContent] = await Promise.all([
                    readFileAsArrayBuffer(uploadedFiles.enc),
                    readFileAsText(uploadedFiles.key)
                ]);
                
                // 验证密钥格式
                const keyHex = keyContent.trim().replace(/\s/g, '');
                if (!/^[0-9a-fA-F]{64}$/.test(keyHex)) {
                    throw new Error('密钥格式错误，应为64位十六进制');
                }
                
                // 这里应该调用实际的解密逻辑
                // 模拟解密过程
                await new Promise(resolve => setTimeout(resolve, 1500));
                
                // 显示验证结果
                let html = '<div class="success">';
                html += '<h3>✅ 验证成功</h3>';
                html += '<p>加密文件已成功解密，证据链完整</p>';
                
                html += '<div class="evidence-grid">';
                html += '<div class="evidence-card">';
                html += '<h4>📸 照片证据</h4>';
                html += '<p>首日封高清照片，带防伪水印</p>';
                html += '<span class="status-badge status-success">已验证</span>';
                html += '</div>';
                
                html += '<div class="evidence-card">';
                html += '<h4>📹 视频证据</h4>';
                html += '<p>邮政APP邮路查询录屏</p>';
                html += '<span class="status-badge status-success">已验证</span>';
                html += '</div>';
                
                html += '<div class="evidence-card">';
                html += '<h4>⏰ 时间戳</h4>';
                html += '<p>区块链时间戳锚定</p>';
                html += '<span class="status-badge status-success">已锚定</span>';
                html += '</div>';
                
                html += '<div class="evidence-card">';
                html += '<h4>🔐 加密</h4>';
                html += '<p>AES-256-CBC加密</p>';
                html += '<span class="status-badge status-success">已验证</span>';
                html += '</div>';
                html += '</div>';
                
                html += '<p style="margin-top: 20px; font-size: 12px; color: #666;">验证时间: ' + new Date().toLocaleString('zh-CN') + '</p>';
                html += '</div>';
                
                resultBox.className = 'result-box success';
                resultBox.innerHTML = html;
                resultBox.style.display = 'block';
                
            } catch (error) {
                resultBox.className = 'result-box error';
                resultBox.innerHTML = '❌ 验证失败: ' + error.message;
                resultBox.style.display = 'block';
            } finally {
                // 恢复按钮状态
                btn.disabled = false;
                btnText.textContent = '🔐 开始完整验证';
            }
        }
        
        // 工具函数
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
        
        function readFileAsArrayBuffer(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = e => resolve(e.target.result);
                reader.onerror = e => reject(new Error('文件读取失败'));
                reader.readAsArrayBuffer(file);
            });
        }
        
        function readFileAsText(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = e => resolve(e.target.result);
                reader.onerror = e => reject(new Error('文件读取失败'));
                reader.readAsText(file);
            });
        }
    </script>
