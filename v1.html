<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STProof 数字存证验证系统 - 修复版</title>
    <!-- 引入 CryptoJS 用于 AES 解密 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        :root {
            --primary-color: #4f46e5;
            --secondary-color: #6366f1;
            --bg-light: #f3f4f6;
            --text-dark: #1f2937;
            --border-color: #e5e7eb;
            --success-color: #10b981;
            --error-color: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            background-color: var(--bg-light);
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        .tabs {
            display: flex;
            border-bottom: 1px solid var(--border-color);
            background: #fff;
        }

        .tab-btn {
            flex: 1;
            padding: 16px 20px;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            color: #6b7280;
            border: none;
            background: transparent;
            position: relative;
            transition: all 0.3s ease;
            font-size: 15px;
        }

        .tab-btn:hover {
            color: var(--primary-color);
        }

        .tab-btn.active {
            color: var(--primary-color);
        }

        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--primary-color);
            border-radius: 3px 3px 0 0;
        }

        .tab-content {
            display: none;
            padding: 40px;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 {
            font-size: 24px;
            margin-bottom: 8px;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h2 .icon {
            width: 28px;
            height: 28px;
            color: var(--primary-color);
        }

        p.subtitle {
            color: #6b7280;
            margin-bottom: 30px;
            font-size: 14px;
        }

        /* --- 快速验证样式 --- */
        .quick-search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .quick-input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border 0.2s;
        }

        .quick-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .btn {
            padding: 12px 24px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 15px;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #4338ca;
        }

        .btn:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .result-box {
            margin-top: 20px;
            padding: 20px;
            border-radius: 8px;
            background: #f9fafb;
            border: 1px dashed #d1d5db;
            display: none;
        }

        .result-box.show {
            display: block;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .result-item:last-child {
            margin-bottom: 0;
        }

        .result-label {
            font-weight: 600;
            color: #4b5563;
        }

        .result-value {
            color: var(--text-dark);
            word-break: break-all;
            text-align: right;
            max-width: 60%;
        }

        .hash-text {
            font-family: monospace;
            background: #f3f4f6;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 13px;
        }

        .status-msg {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            display: none;
        }

        .status-msg.error {
            background: #fee2e2;
            color: var(--error-color);
            display: block;
        }

        .status-msg.success {
            background: #dcfce7;
            color: var(--success-color);
            display: block;
        }

        /* --- 完整验证样式 --- */
        .upload-area {
            border: 2px dashed #d1d5db;
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            background: #f9fafb;
            transition: all 0.3s;
            margin-bottom: 24px;
            cursor: pointer;
            position: relative;
        }

        .upload-area:hover {
            border-color: var(--primary-color);
            background: #eff6ff;
        }

        .upload-icon {
            width: 48px;
            height: 48px;
            margin: 0 auto 16px;
            color: #9ca3af;
        }

        .upload-title {
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-dark);
        }

        .upload-hint {
            font-size: 13px;
            color: #6b7280;
        }

        .file-list {
            margin-bottom: 24px;
        }

        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: #f3f4f6;
            border-radius: 8px;
            margin-bottom: 8px;
            border: 1px solid #e5e7eb;
        }

        .file-info {
            display: flex;
            flex-direction: column;
        }

        .file-name {
            font-weight: 600;
            font-size: 14px;
            word-break: break-all;
        }

        .file-size {
            font-size: 12px;
            color: #6b7280;
        }

        .remove-file {
            color: var(--error-color);
            cursor: pointer;
            font-weight: bold;
            font-size: 18px;
            padding: 4px;
        }

        .decrypt-preview {
            margin-top: 20px;
            padding: 20px;
            background: #1f2937;
            color: #d1d5db;
            border-radius: 8px;
            font-family: monospace;
            font-size: 13px;
            white-space: pre-wrap;
            display: none;
            max-height: 300px;
            overflow-y: auto;
        }

        .decrypt-preview.show {
            display: block;
        }

    </style>
</head>
<body>

<div class="container">
    <!-- 顶部导航 Tabs -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('quick')">
            <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
            快速验证
        </button>
        <button class="tab-btn" onclick="switchTab('full')">
            <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            完整验证
        </button>
    </div>

    <!-- 快速验证 Tab 内容 -->
    <div id="quick-tab" class="tab-content active">
        <h2>编号查询 + 哈希验证</h2>
        <p class="subtitle">输入信封编号，系统将自动从数据库查询并验证哈希值
        
        <div class="quick-search-box">
            <input type="text" id="codeInput" class="quick-input" placeholder="请输入编号，例如：STP-20260601-002">
            <button class="btn" onclick="verifyQuick()">立即验证</button>
        </div>

        <div id="quickStatus" class="status-msg"></div>

        <div id="quickResult" class="result-box">
            <!-- 结果会动态插入这里 -->
        </div>
    </div>

    <!-- 完整验证 Tab 内容 -->
    <div id="full-tab" class="tab-content">
        <h2>完整证据链验证</h2>
        <p class="subtitle">上传加密文件 (.enc) 和对应的密钥文件 (.key.txt) 进行解密查看
        
        <!-- 上传区域 -->
        <div id="uploadArea" class="upload-area" onclick="document.getElementById('fileInput').click()">
            <svg class="upload-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
            <div class="upload-title">点击上传加密文件 (.enc)</div>
            <div class="upload-hint">和对应的密钥文件 (.key.txt)</div>
            <input type="file" id="fileInput" style="display: none;" multiple onchange="handleFileSelect(event)">
        </div>

        <!-- 文件列表 -->
        <div id="fileList" class="file-list"></div>

        <!-- 操作按钮 -->
        <button id="decryptBtn" class="btn" style="width: 100%;" onclick="decryptFiles()" disabled>开始解密验证</button>

        <!-- 解密预览 -->
        <div id="decryptPreview" class="decrypt-preview">
            <div style="color: #10b981; margin-bottom: 10px;">✅ 解密成功！明文内容如下：</div>
            <div id="plainTextContent"></div>
        </div>
    </div>
</div>

<script>
    // 全局变量存储选中的文件
    let selectedFiles = {
        enc: null,
        key: null
    };

    // Tab 切换
    function switchTab(tabName) {
        // 隐藏所有内容
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        
        // 显示当前 Tab
        document.getElementById(tabName + '-tab').classList.add('active');
        event.currentTarget.classList.add('active');
    }

    // ================= 快速验证逻辑 =================
    async function verifyQuick() {
        const code = document.getElementById('codeInput').value.trim();
        const statusDiv = document.getElementById('quickStatus');
        const resultDiv = document.getElementById('quickResult');
        
        if (!code) {
            statusDiv.className = 'status-msg error';
            statusDiv.textContent = '❌ 请输入编号';
            resultDiv.classList.remove('show');
            return;
        }

        statusDiv.className = 'status-msg';
        statusDiv.textContent = '⏳ 正在查询数据库...';
        resultDiv.classList.remove('show');

        try {
            // 注意：如果你的 data.json 和 html 不在同一目录，请修改下面的路径
            const response = await fetch('data.json?t=' + new Date().getTime());
            
            if (!response.ok) {
                throw new Error(`HTTP 错误! 状态码: ${response.status}`);
            }
            
            const data = await response.json();
            
            if (data[code]) {
                const record = data[code];
                statusDiv.className = 'status-msg success';
                statusDiv.textContent = '✅ 找到记录，验证通过';
                
                resultDiv.innerHTML = `
                    <div class="result-item">
                        <span class="result-label">编号：</span>
                        <span class="result-value">${code}</span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">日期：</span>
                        <span class="result-value">${record.date || 'N/A'}</span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">邮路：</span>
                        <span class="result-value">${record.route || 'N/A'}</span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">哈希值 (SHA256)：</span>
                        <span class="result-value hash-text">${record.hash}</span>
                    </div>
                `;
                resultDiv.classList.add('show');
            } else {
                statusDiv.className = 'status-msg error';
                statusDiv.textContent = `❌ 未找到编号 "${code}" 的存证记录`;
                resultDiv.classList.remove('show');
            }
        } catch (error) {
            console.error('查询失败:', error);
            statusDiv.className = 'status-msg error';
            statusDiv.textContent = '❌ 查询失败：' + error.message + '。请确保 data.json 文件存在且路径正确。';
            resultDiv.classList.remove('show');
        }
    }

    // ================= 完整验证逻辑 =================
    
    // 处理文件选择
    function handleFileSelect(event) {
        const files = Array.from(event.target.files);
        
        files.forEach(file => {
            const fileName = file.name.toLowerCase();
            
            if (fileName.endsWith('.enc')) {
                selectedFiles.enc = file;
            } else if (fileName.endsWith('.key.txt')) {
                selectedFiles.key = file;
            }
        });

        updateFileList();
        checkDecryptButton();
    }

    // 更新文件列表显示
    function updateFileList() {
        const listDiv = document.getElementById('fileList');
        listDiv.innerHTML = '';

        for (const type in selectedFiles) {
            const file = selectedFiles[type];
            if (file) {
                const item = document.createElement('div');
                item.className = 'file-item';
                item.innerHTML = `
                    <div class="file-info">
                        <div class="file-name">${file.name}</div>
                        <div class="file-size">${(file.size / 1024).toFixed(2)} KB</div>
                    </div>
                    <div class="remove-file" onclick="removeFile('${type}')">×</div>
                `;
                listDiv.appendChild(item);
            }
        }
    }

    // 移除文件
    function removeFile(type) {
        selectedFiles[type] = null;
        document.getElementById('fileInput').value = ''; // 清空 input
        updateFileList();
        checkDecryptButton();
        document.getElementById('decryptPreview').classList.remove('show');
    }

    // 检查是否可以解密
    function checkDecryptButton() {
        const btn = document.getElementById('decryptBtn');
        if (selectedFiles.enc && selectedFiles.key) {
            btn.disabled = false;
            btn.textContent = '开始解密验证';
        } else {
            btn.disabled = true;
            btn.textContent = '请先上传 .enc 和 .key.txt 文件';
        }
    }

    // 解密核心逻辑
    async function decryptFiles() {
        if (!selectedFiles.enc || !selectedFiles.key) return;

        const btn = document.getElementById('decryptBtn');
        const preview = document.getElementById('decryptPreview');
        const contentDiv = document.getElementById('plainTextContent');
        
        btn.disabled = true;
        btn.textContent = '⏳ 正在解密...';
        preview.classList.remove('show');

        try {
            // 读取密钥
            const keyArrayBuffer = await readFileAsArrayBuffer(selectedFiles.key);
            const keyWordArray = CryptoJS.lib.WordArray.create(keyArrayBuffer);
            
            // 读取密文
            const encArrayBuffer = await readFileAsArrayBuffer(selectedFiles.enc);
            const encWordArray = CryptoJS.lib.WordArray.create(encArrayBuffer);
            
            // 解密 (默认使用 AES ECB 模式，因为大多数简单存证使用此模式)
            // 如果你的后端使用了其他模式（如 CBC），这里需要调整
            const decrypted = CryptoJS.AES.decrypt(
                { ciphertext: encWordArray }, 
                keyWordArray, 
                { mode: CryptoJS.mode.ECB, padding: CryptoJS.pad.Pkcs7 }
            );

            // 转为文本
            const plaintext = decrypted.toString(CryptoJS.enc.Utf8);

            if (!plaintext) {
                throw new Error('解密结果为空，可能是密钥不匹配或文件损坏');
            }

            // 显示结果
            contentDiv.textContent = plaintext;
            preview.classList.add('show');
            btn.textContent = '✅ 解密成功';

        } catch (error) {
            console.error('解密失败:', error);
            contentDiv.textContent = '解密失败: ' + error.message;
            preview.style.background = '#ef4444';
            preview.style.color = 'white';
            preview.querySelector('div').style.display = 'none'; // 隐藏成功图标
            preview.classList.add('show');
            btn.textContent = '❌ 解密失败，请检查文件';
        } finally {
            btn.disabled = false;
        }
    }

    // 读取文件为 ArrayBuffer
    function readFileAsArrayBuffer(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsArrayBuffer(file);
        });
    }

</script>

</body>
</html>
