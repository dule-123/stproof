<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STProof 数字存证验证系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #F7F8FA 0%, #e8eaf1 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 800px;
            overflow: hidden;
        }
        
        /* 头部 */
        .header {
            background: linear-gradient(90deg, #4F46E5 0%, #7C3AED 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 { font-size: 24px; margin-bottom: 5px; }
        .header p { opacity: 0.9; font-size: 14px; }

        /* 标签页 */
        .tabs {
            display: flex;
            border-bottom: 1px solid #e5e7eb;
            background: #f9fafb;
        }
        .tab-btn {
            flex: 1;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            font-weight: 500;
            color: #6b7280;
            border: none;
            background: transparent;
            position: relative;
            transition: all 0.3s;
        }
        .tab-btn.active {
            color: #4F46E5;
            font-weight: 600;
        }
        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 2px;
            background: #4F46E5;
        }

        /* 内容区 */
        .content {
            padding: 30px;
        }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* 快速验证 */
        .quick-verify { text-align: center; }
        .input-group { margin: 20px 0; }
        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
            transition: border 0.3s;
        }
        .input-group input:focus { outline: none; border-color: #4F46E5; box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
        
        /* 上传区域 */
        .upload-section { margin-top: 20px; }
        .file-slots {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        .file-slot {
            border: 2px dashed #d1d5db;
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }
        .file-slot:hover { border-color: #4F46E5; background: #f8faff; }
        .file-slot.has-file { border-style: solid; border-color: #10b981; background: #f0fdf4; }
        
        .file-icon { font-size: 32px; margin-bottom: 10px; }
        .file-name { font-weight: 500; color: #374151; word-break: break-all; }
        .file-size { font-size: 12px; color: #6b7280; margin-top: 4px; }
        
        .remove-btn {
            position: absolute;
            top: 5px;
            right: 10px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            line-height: 18px;
            cursor: pointer;
            display: none;
        }
        .file-slot.has-file .remove-btn { display: block; }

        .verify-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #4F46E5 0%, #7C3AED 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.3s;
        }
        .verify-btn:hover { opacity: 0.9; }
        .verify-btn:disabled { background: #9ca3af; cursor: not-allowed; }

        /* 结果区 */
        .result-area { margin-top: 30px; }
        .status-box {
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        .status-box.success { background: #dcfce7; color: #166534; border: 1px solid #86efac; display: block; }
        .status-box.error { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; display: block; }
        .status-box.info { background: #dbeafe; color: #1e40af; border: 1px solid #93c5fd; display: block; }

        .evidence-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        .evidence-item img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
        }
        
        .hash-display {
            background: #f3f4f6;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            word-break: break-all;
            font-family: monospace;
            font-size: 13px;
            text-align: left;
            max-height: 100px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1>📮 STProof 数字存证</h1>
            信封真实性验证系统
        </div>

        <!-- 标签页 -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('quick')">⚡ 快速验证</button>
            <button class="tab-btn" onclick="switchTab('full')">🔍 完整验证</button>
        </div>

        <div class="content">
            <!-- 快速验证 Tab -->
            <div id="quickTab" class="tab-pane active">
                <div class="quick-verify">
                    <h2>编号查询 + 哈希比对</h2>
                    输入信封编号，系统将自动从数据库调取存证信息进行比对。
                    
                    <div class="input-group">
                        <input type="text" id="codeInput" placeholder="请输入信封编号 (例如: STP-20260303-001)" onkeypress="handleKeyPress(event)">
                    </div>
                    <button class="verify-btn" onclick="quickVerify()">立即验证</button>

                    <div id="quickResult" class="result-area"></div>
                </div>
            </div>

            <!-- 完整验证 Tab -->
            <div id="fullTab" class="tab-pane">
                <div class="upload-section">
                    <h2>完整证据链验证</h2>
                    上传加密文件 <code>.enc</code> 和对应的密钥文件 <code>.key.txt</code>，系统将解密并展示完整证据。

                    <div class="file-slots">
                        <!-- Enc 文件槽 -->
                        <div class="file-slot" id="encSlot" onclick="document.getElementById('encInput').click()">
                            <div class="file-icon">📄</div>
                            <div class="file-name" id="encName">点击上传加密文件 (.enc)</div>
                            <div class="file-size" id="encSize"></div>
                            <button class="remove-btn" onclick="removeFile('enc', event)">x</button>
                        </div>
                        <input type="file" id="encInput" style="display:none;" onchange="handleFileSelect(event, 'enc')" accept=".enc">

                        <!-- Key 文件槽 -->
                        <div class="file-slot" id="keySlot" onclick="document.getElementById('keyInput').click()">
                            <div class="file-icon">🔑</div>
                            <div class="file-name" id="keyName">点击上传密钥文件 (.key.txt)</div>
                            <div class="file-size" id="keySize"></div>
                            <button class="remove-btn" onclick="removeFile('key', event)">x</button>
                        </div>
                        <input type="file" id="keyInput" style="display:none;" onchange="handleFileSelect(event, 'key')" accept=".txt">
                    </div>

                    <button class="verify-btn" id="fullVerifyBtn" onclick="fullVerify()" disabled>开始完整验证</button>

                    <div id="fullResult" class="result-area"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 模拟数据库 (实际使用时替换为真实的 data.json 请求)
        const mockDB = {
            "STP-20260303-001": {
                hash: "a1b2c3d4e5f6789012345678901234567890abcdef1234567890abcdef123456",
                date: "2026-03-03",
                route: "北京 -> 上海",
                images: [
                    "https://picsum.photos/200/200?random=1",
                    "https://picsum.photos/200/200?random=2"
                ],
                status: "verified"
            }
        };

        // 切换标签页
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-pane').forEach(pane => pane.classList.remove('active'));
            
            if(tab === 'quick') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('quickTab').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('fullTab').classList.add('active');
            }
        }

        // 处理回车键
        function handleKeyPress(event) {
            if (event.key === 'Enter') quickVerify();
        }

        // 1. 快速验证逻辑
        async function quickVerify() {
            const code = document.getElementById('codeInput').value.trim().toUpperCase();
            const resultDiv = document.getElementById('quickResult');
            
            if (!code) {
                showResult(resultDiv, 'error', '请输入信封编号');
                return;
            }

            showResult(resultDiv, 'info', `正在查询编号: ${code}...`);

            try {
                // 模拟网络延迟
                await new Promise(resolve => setTimeout(resolve, 500));

                // 模拟从服务器获取数据 (替换为 fetch)
                // const res = await fetch(`https://your-api.com/data.json?v=${Date.now()}`);
                // const data = await res.json();
                
                const data = mockDB; // 使用模拟数据
                const record = data[code];

                if (record) {
                    let html = `<h3>✅ 验证通过</h3>`;
                    html += `<strong>编号:</strong> ${code}`;
                    html += `<strong>日期:</strong> ${record.date}`;
                    html += `<strong>邮路:</strong> ${record.route}`;
                    html += `<div class="hash-display"><strong>SHA256:</strong> ${record.hash}</div>`;
                    
                    if (record.images && record.images.length > 0) {
                        html += `<strong>存证图片:</strong><div class="evidence-grid">`;
                        record.images.forEach(img => {
                            html += `<div class="evidence-item"><img src="${img}" alt="证据"></div>`;
                        });
                        html += `</div>`;
                    }
                    
                    showResult(resultDiv, 'success', html);
                } else {
                    showResult(resultDiv, 'error', `未找到编号 "${code}" 的存证记录，请检查编号是否正确。`);
                }
            } catch (err) {
                showResult(resultDiv, 'error', `查询失败: ${err.message}`);
            }
        }

        // 2. 完整验证逻辑 (修复点)
        let uploadedFiles = {
            enc: null,
            key: null
        };

        // 处理文件选择
        function handleFileSelect(event, type) {
            const file = event.target.files[0];
            if (!file) return;

            // 验证文件类型
            if (type === 'enc' && !file.name.endsWith('.enc')) {
                alert('请选择正确的 .enc 加密文件');
                return;
            }
            if (type === 'key' && !file.name.endsWith('.key.txt')) {
                alert('请选择正确的 .key.txt 密钥文件');
                return;
            }

            uploadedFiles[type] = file;
            updateFileSlot(type, file);
            checkEnableVerifyButton();
        }

        // 更新文件槽显示
        function updateFileSlot(type, file) {
            const slot = document.getElementById(`${type}Slot`);
            const nameEl = document.getElementById(`${type}Name`);
            const sizeEl = document.getElementById(`${type}Size`);
            
            nameEl.textContent = file.name;
            sizeEl.textContent = formatFileSize(file.size);
            slot.classList.add('has-file');
        }

        // 移除文件
        function removeFile(type, event) {
            event.stopPropagation(); // 阻止冒泡触发父级点击
            uploadedFiles[type] = null;
            
            const slot = document.getElementById(`${type}Slot`);
            const nameEl = document.getElementById(`${type}Name`);
            const sizeEl = document.getElementById(`${type}Size`);
            
            nameEl.textContent = type === 'enc' ? '点击上传加密文件 (.enc)' : '点击上传密钥文件 (.key.txt)';
            sizeEl.textContent = '';
            slot.classList.remove('has-file');
            
            // 清空 input 的值，允许重复选择同一文件
            document.getElementById(`${type}Input`).value = '';
            
            checkEnableVerifyButton();
        }

        // 检查是否可以启用验证按钮
        function checkEnableVerifyButton() {
            const btn = document.getElementById('fullVerifyBtn');
            if (uploadedFiles.enc && uploadedFiles.key) {
                btn.disabled = false;
                btn.textContent = '🔓 开始完整验证';
            } else {
                btn.disabled = true;
                btn.textContent = '开始完整验证 (缺少文件)';
            }
        }

        // 格式化文件大小
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // 完整验证主函数
        async function fullVerify() {
            const resultDiv = document.getElementById('fullResult');
            showResult(resultDiv, 'info', '正在解密并验证证据链...');

            try {
                if (!uploadedFiles.enc || !uploadedFiles.key) {
                    throw new Error('请确保已上传 .enc 和 .key.txt 两个文件');
                }

                // 读取文件内容
                const encContent = await readFileAsText(uploadedFiles.enc);
                const keyContent = await readFileAsText(uploadedFiles.key);

                // 🔥 这里接入你的实际解密/验证逻辑
                // 示例：模拟验证成功
                await new Promise(resolve => setTimeout(resolve, 1000)); // 模拟耗时

                let html = `<h3>✅ 解密成功，验证通过</h3>`;
                html += `<div class="hash-display"><strong>解密后数据预览:</strong>${encContent.substring(0, 200)}...</div>`;
                
                // 模拟展示证据
                html += `<strong>关联证据:</strong><div class="evidence-grid">
                    <div class="evidence-item"><img src="https://picsum.photos/200/200?random=3" alt="解密图片1"></div>
                    <div class="evidence-item"><img src="https://picsum.photos/200/200?random=4" alt="解密图片2"></div>
                </div>`;

                showResult(resultDiv, 'success', html);

            } catch (err) {
                showResult(resultDiv, 'error', `验证失败: ${err.message}`);
            }
        }

        // 读取文件为文本
        function readFileAsText(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = e => resolve(e.target.result);
                reader.onerror = e => reject(new Error('文件读取失败'));
                reader.readAsText(file);
            });
        }

        // 显示结果
        function showResult(container, type, message) {
            container.innerHTML = message;
            container.className = 'result-area'; // 重置
            if (type) container.classList.add(type);
        }
    </script>
</body>
</html>
